<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590" role="img" aria-labelledby="title desc">
  <title id="title">From single-tool calls to multi-tool orchestration</title>
  <desc id="desc">A single request-call-result sequence evolves into dependent planning, parallel tool execution, verification, and recovery. Six survey dimensions organize this research.</desc>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#0c1630" /><stop offset="1" stop-color="#142c49" /></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4" /><stop offset="1" stop-color="#60a5fa" /></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#91a7c6" stroke-width="1.4" /></marker>
    </defs>
  <rect width="1280" height="590" rx="24" fill="#0c1630" />
  <rect x="40" y="38" width="7" height="60" rx="3" fill="url(#accent)" />
  <text x="65" y="65" fill="#f8fafc" font-size="31" font-weight="700" font-family="Arial,Helvetica,sans-serif">TOOL USE IS EVOLVING.</text>
  <text x="65" y="94" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#a9bfd9">From isolated invocations to stateful, long-horizon execution.</text>
  <rect x="42" y="130" width="285" height="250" rx="18" fill="#172942" stroke="#344c6b" stroke-width="1.5" />
  <text x="65" y="164" fill="#b6c8de" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif">SINGLE-TOOL CALL</text>
  <rect x="85" y="185" width="200" height="43" rx="10" fill="#213a59" />
  <text x="185" y="213" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Request</text>
  <path d="M185 231V249" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="85" y="255" width="200" height="43" rx="10" fill="#213a59" />
  <text x="185" y="283" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Tool call</text>
  <path d="M185 301V319" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="185" y="349" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Result</text>
  <path d="M344 254H392" fill="none" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="414" y="130" width="824" height="250" rx="18" fill="#172942" stroke="#344c6b" stroke-width="1.5" />
  <text x="438" y="164" fill="#5eead4" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif">MULTI-TOOL ORCHESTRATION</text>
  <rect x="444" y="231" width="129" height="52" rx="12" fill="#244565" />
  <text x="508" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Plan</text>
  <rect x="630" y="188" width="160" height="52" rx="12" fill="#153f49" stroke="#2b807b" />
  <text x="710" y="221" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Tool A</text>
  <rect x="630" y="276" width="160" height="52" rx="12" fill="#153f49" stroke="#2b807b" />
  <text x="710" y="309" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Tool B</text>
  <path d="M576 249H601V214H625" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M576 266H601V302H625" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="850" y="231" width="142" height="52" rx="12" fill="#30305a" stroke="#7475b8" />
  <text x="921" y="264" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#eaf2ff" font-weight="600">Verify</text>
  <path d="M793 214H817V249H845" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M793 302H817V266H845" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
