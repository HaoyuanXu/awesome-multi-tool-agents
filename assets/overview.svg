  <path d="M922 287V349H508V288" stroke-dasharray="6 5" fill="none" stroke="#91a7c6" stroke-width="2" marker-end="url(#arrow)" />
  <text x="710" y="369" text-anchor="middle" fill="#a9bfd9" font-size="16" font-family="Arial,Helvetica,sans-serif">STATE · FEEDBACK · LOCAL REPAIR</text>
  <text x="44" y="426" fill="#c8d7eb" font-size="17" font-weight="700" font-family="Arial,Helvetica,sans-serif">SIX CONNECTED RESEARCH DIMENSIONS</text>
  <rect x="42" y="449" width="380" height="46" rx="12" fill="#1f365d" />
  <circle cx="66" cy="472" r="7" fill="#60a5fa" /><text x="86" y="479" fill="#dbeafe" font-size="19" font-family="Arial,Helvetica,sans-serif">Planning and execution</text>
  <rect x="449" y="449" width="380" height="46" rx="12" fill="#153f3c" />
  <circle cx="473" cy="472" r="7" fill="#34d399" /><text x="493" y="479" fill="#d1fae5" font-size="19" font-family="Arial,Helvetica,sans-serif">Training and trajectories</text>
  <rect x="856" y="449" width="382" height="46" rx="12" fill="#45283b" />
  <circle cx="880" cy="472" r="7" fill="#fb7185" /><text x="900" y="479" fill="#ffe4e6" font-size="19" font-family="Arial,Helvetica,sans-serif">Safety and control</text>
  <rect x="42" y="513" width="380" height="46" rx="12" fill="#463823" />
  <circle cx="66" cy="536" r="7" fill="#fbbf24" /><text x="86" y="543" fill="#fef3c7" font-size="19" font-family="Arial,Helvetica,sans-serif">Latency and cost</text>
  <rect x="449" y="513" width="380" height="46" rx="12" fill="#183c4a" />
  <circle cx="473" cy="536" r="7" fill="#22d3ee" /><text x="493" y="543" fill="#cffafe" font-size="19" font-family="Arial,Helvetica,sans-serif">Capability completeness</text>
  <rect x="856" y="513" width="382" height="46" rx="12" fill="#352b56" />
  <circle cx="880" cy="536" r="7" fill="#a78bfa" /><text x="900" y="543" fill="#ede9fe" font-size="19" font-family="Arial,Helvetica,sans-serif">Benchmarks and evaluation</text>
